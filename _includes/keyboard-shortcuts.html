<button class="keyboard-help-button no-print" type="button" data-keyboard-help aria-haspopup="dialog" aria-controls="keyboard-help" aria-label="Keyboard shortcuts (?)" title="Keyboard shortcuts (?)">?</button>

<dialog class="keyboard-help" id="keyboard-help" aria-labelledby="keyboard-help-title">
  <div class="keyboard-help-card">
    <button class="keyboard-help-close" type="button" data-keyboard-help-close aria-label="Close keyboard shortcuts">×</button>
    <p class="keyboard-help-kicker">Keyboard navigation</p>
    <h2 id="keyboard-help-title">Shortcuts</h2>
    <dl class="keyboard-help-list">
      <div><dt><kbd>Tab</kbd> / <kbd>Shift</kbd> + <kbd>Tab</kbd></dt><dd>Move between controls</dd></div>
      <div><dt><kbd>H</kbd></dt><dd>Home</dd></div>
      <div><dt><kbd>C</kbd></dt><dd>CV</dd></div>
      <div><dt><kbd>P</kbd></dt><dd>Projects</dd></div>
      <div><dt><kbd>T</kbd></dt><dd>Toggle theme</dd></div>
      <div><dt><kbd>?</kbd></dt><dd>Open or close this panel</dd></div>
      <div><dt><kbd>←</kbd> / <kbd>↑</kbd></dt><dd>CV: previous section</dd></div>
      <div><dt><kbd>→</kbd> / <kbd>↓</kbd></dt><dd>CV: next section</dd></div>
      <div><dt><kbd>1</kbd>–<kbd>9</kbd></dt><dd>CV: jump to section</dd></div>
      <div><dt><kbd>←</kbd> / <kbd>→</kbd></dt><dd>Projects: move between cards</dd></div>
      <div><dt><kbd>Esc</kbd></dt><dd>Close dialogs</dd></div>
    </dl>
  </div>
</dialog>
