{% for item in include.content %}
  <div class="row clearfix layout layout-left education-item border-{{ item.border | default: 'no' }}">
    <div class="col-xs-12 col-sm-8 col-md-9 col-print-12 details">
      <h4 id="{{ item.title | slugify }}">{{ item.title }}</h4>
      {%- if item.sub_title -%}<p><b>{{ item.sub_title }}</b></p>{%- endif -%}
      {%- if item.caption -%}<p>{{ item.caption }}</p>{%- endif -%}
    </div>
    {%- if item.level -%}
      <div class="col-xs-12 col-sm-4 col-md-3 col-print-12 education-level">
        <span class="level-badge level-{{ item.level | slugify }}">{{ item.level }}</span>
      </div>
    {%- endif -%}
  </div>
{% endfor %}
