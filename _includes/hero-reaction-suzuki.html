<div class="molecule-playground">
  <div class="playground-header">
    <span>Suzuki–Miyaura</span>
    <span class="playground-live"><i></i> Pd C–C coupling</span>
  </div>

  <svg viewBox="0 0 600 280" role="img" aria-label="Playful Suzuki–Miyaura coupling animation">
    <defs>
      <filter id="suzuki-glow">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <g class="playground-scene">
      <g class="satellite satellite-left">
        <polygon points="110,60 136,75 136,105 110,120 84,105 84,75"/>
        <text x="70" y="90" class="hetero">Br</text>
      </g>

      <g class="satellite satellite-right">
        <polygon points="490,60 516,75 516,105 490,120 464,105 464,75"/>
        <text x="530" y="90" class="hetero">B</text>
      </g>

      <line class="forming-bond bond-left" x1="136" y1="90" x2="240" y2="140"/>
      <line class="forming-bond bond-right" x1="360" y1="140" x2="464" y2="90"/>
      <circle class="bond-flash" cx="188" cy="115" r="5" filter="url(#suzuki-glow)"/>
      <circle class="bond-flash bond-flash-right" cx="412" cy="115" r="5" filter="url(#suzuki-glow)"/>

      <g class="core-molecule">
        <polygon points="230,140 260,122 290,140 290,176 260,194 230,176"/>
        <polygon points="310,140 340,122 370,140 370,176 340,194 310,176"/>
        <line class="central-bond" x1="290" y1="158" x2="310" y2="158"/>
      </g>

      <g class="pd-orbit">
        <circle class="pd" cx="300" cy="55" r="12"/>
        <text class="pd-label" x="300" y="59">Pd</text>
      </g>

      <circle class="sparkle sparkle-1" cx="170" cy="60" r="2.5"/>
      <circle class="sparkle sparkle-2" cx="430" cy="55" r="2"/>
      <circle class="sparkle sparkle-3" cx="205" cy="210" r="2"/>
      <circle class="sparkle sparkle-4" cx="400" cy="215" r="2.5"/>
      <circle class="sparkle sparkle-5" cx="90" cy="170" r="2"/>
      <circle class="sparkle sparkle-6" cx="510" cy="180" r="2"/>
    </g>
  </svg>

  <div class="playground-footer">
    <span>Ph–Br + Ph–B(OH)₂ → Ph–Ph</span>
    <span>Small molecules · Big ideas</span>
  </div>
</div>
