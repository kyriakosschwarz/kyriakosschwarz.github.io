  Hej, I'm Kyriakos. I build computational tools for drug discovery.

cv_content: |
  Hej, I'm Kyriakos. I combine chemistry, biology, and computation to help bring better medicines to patients, focusing on <mark>cheminformatics</mark>, <mark>machine learning</mark>, and <mark>software engineering</mark>. I build scalable pipelines, predictive models, and scientist-friendly software for compound selection and reaction prediction.

  I hold a Ph.D. in <mark>Medical Artificial Intelligence</mark> from the <a href="https://www.uzh.ch/en.html">University of Zurich</a>, affiliated with the <a href="https://www.usz.ch/en/">University Hospital Zurich</a> and the <a href="https://ai.ethz.ch/">ETH AI Center</a>. I am currently a Postdoctoral Researcher with <a href="https://bsse.ethz.ch/">ETH Zurich (BSSE)</a> and <a href="https://www.roche.com/innovation/structure/rnd-locations/pharma-basel">Roche in Basel</a>.
