content:
  - title: Cheminformatics & Drug Discovery # Title for the section
    projects: true
    order: 100
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        border: weak
        title: "Database of Unified Chemical Knowledge (DUCK)"
        image: images/duck_sunburst.png
        tags:
          - Cheminformatics
          - Reaction data
          - Machine learning
        additional_links:
          - title: Paper
            icon: fas fa-graduation-cap
            url: https://chemrxiv.org/doi/full/10.26434/chemrxiv.15002055/v2
        description: |
          I worked on the <mark>Database of Unified Chemical Knowledge (DUCK)</mark> project, transforming 15 years of Roche Electronic Lab Notebook (ELN) data into a robust engine for chemical AI. By incorporating synthetic failures (negative data) alongside successes, we reduced bias in Machine Learning models and improved the reliability of chemical yield predictions. This research mapped the industrial repertoire, highlighting heavy reliance on C-N and C-C bond formations.

          ![DUCK Sunburst Plot](/images/duck_sunburst.png "Industrial reaction classes")
      - layout: left
        border: weak
        title: "AttentionDDI: Explainable drug–drug interaction prediction"
        image: images/ddi.png
        tags:
          - PyTorch
          - Transformer
          - Drug safety
        additional_links:
          - title: Code
            icon: fab fa-github
            url: https://github.com/uzh-dqbm-cmi/side-effects/
          - title: Paper
            icon: fas fa-graduation-cap
            url: https://bmcbioinformatics.biomedcentral.com/articles/10.1186/s12859-021-04325-y
        description: |
          I developed a novel Deep Learning architecture - <mark>AttentionDDI</mark> - in <mark>PyTorch</mark> for the prediction of previously unknown medication side effects. The model is <mark>Transformer</mark>-based and through an <mark>Attention</mark> mechanism it provides explainability over which input data modality (chemical structures, side effects, targets, etc.) is weighted more for improved predictions.

          ![Transformer model](/images/ddi.png "Transformer model")
      - layout: left
        border: weak
        title: "Drug prescription clusters in the UK Biobank"
        image: images/ukbpatient.png
        tags:
          - Data science
          - UK Biobank
          - DDIs
        additional_links:
          - title: Paper
            icon: fas fa-graduation-cap
            url: https://arxiv.org/abs/2207.08665
        description: |
          I created patient clusters, according to their drug prescription history, and analyzed the prevalence of DDIs in each cluster, which may influence their five-year mortality. I examined whether specific drug combinations may lead to additional health effects in the <a href="https://www.ukbiobank.ac.uk/">UK Biobank</a> participants. For this project I employed the <mark>Scikit-Learn</mark>, <mark>RapidsAI</mark>, <mark>Scipy</mark> and <mark>statsmodels</mark> data science libraries.

          ![UK Biobank patient](/images/ukbpatient.png "UK Biobank patient")
      - layout: left
        border:
        title: "DDoS: Graph Neural Network for drug synergy prediction"
        image: images/gnn_molecule.png
        tags:
          - PyTorch
          - GNN
          - Drug synergy
        additional_links:
          - title: Code
            icon: fab fa-github
            url: https://github.com/uzh-dqbm-cmi/graphnn
          - title: Paper
            icon: fas fa-graduation-cap
            url: https://arxiv.org/abs/2210.00802
        description: |
          A novel Graph Deep Learning architecture - <mark>DDoS</mark> - in <mark>PyTorch</mark> for the prediction of synergistic effects of drugs in specific cell lines. The model learns task-specific representations of molecules (drug chemical structures) through a Graph Neural Network and takes advantage of gene expression features of cell lines in order to improve drug combination synergy predictions.

          ![Graph Neural Network model](/images/gnn_molecule.png "Graph Neural Network model")

  - title: Bioinformatics # Title for the section
    projects: true
    order: 100
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        border: weak  # Value of `weak` will display a weak border below this item. # Any
                      # other value (or no value) means no border will be displayed
        title: "Long non-coding RNA structure estimation"
#        link: Link to project (eg. sproogen.github.io/modern-resume-theme)(optional)
#        link_text: Link Text
        additional_links:
#          - title:  Code
#            icon: fab fa-github
#            url: https://bitbucket.org/kyriakosschwarz/muehle/src/fb59a339d3655c9b8006caaa64b2a99fa5099e72/
          - title:  Paper
            icon: fas fa-graduation-cap
            url: https://www.nature.com/articles/s41467-023-39160-7
        description: | # this will include new lines to allow paragraphs
          Computational methods that have aimed to predict cancer driver lncRNA genes have thus far relied on scores that do not specifically reflect the <a href="https://en.wikipedia.org/wiki/Long_non-coding_RNA">lncRNA</a> biology. Therefore, Functional Impact scores, such as conservation scores or base pairing probabilties from RNA secondary structure can be included to improve those predictions. In this project I calculated lncRNA base pairing probabilities and correlated them with conservation scores to examine whether secondary structure is suggestive of gene function. Tools used for this project: <mark>Bash (awk, bedtools, bwtool, etc.)</mark>, <mark>Python (Snakemake)</mark>, <mark>R</mark>, <mark>RNAfold/RNAsnp</mark>

          ![Trans mod](/images/rnafold.png "RNA secondary structure")
      - layout: left
        border:   # Value of `weak` will display a weak border below this item. # Any
                      # other value (or no value) means no border will be displayed
        title: "EM algorithm for genomic methylation profiles"
#        link: Link to project (eg. sproogen.github.io/modern-resume-theme)(optional)
#        link_text: Link Text
        additional_links:
          - title:  Code
            icon: fab fa-github
            url: https://bitbucket.org/jennifer_semple/emclassifier/src/master/
#          - title:  Paper
#            icon: fas fa-graduation-cap
#            url: https://www.biorxiv.org/content/10.1101/2021.11.06.467555
        description: | # this will include new lines to allow paragraphs
          In <i><a href="https://en.wikipedia.org/wiki/Caenorhabditis_elegans">C. elegans</a></i> the expression of X-linked genes is downregulated by half by modifying transcription initiation. Here, an <a href="https://en.wikipedia.org/wiki/Expectation%E2%80%93maximization_algorithm">EM</a> algorithm was applied to a dataset containing the positions and the methylation status of Cytosines around the transcription start site (<i>TSS</i>) of various genes. The algorithm is written in <mark>R</mark>.

          ![TSS methylation](/images/EM.png "TSS methylation")
  - title: Molecular Biology # Title for the section
    projects: true
    order: 100
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        border:   # Value of `weak` will display a weak border below this item. # Any
                      # other value (or no value) means no border will be displayed
        title: "Effects of tubulin-tyrosine ligase on alpha-tubulin"
#        link: Link to project (eg. sproogen.github.io/modern-resume-theme)(optional)
#        link_text: Link Text
#        additional_links:
#          - title:  Code
#            icon: fab fa-github
#            url: https://github.com/uzh-dqbm-cmi/side-effects/
#          - title:  Paper
#            icon: fas fa-graduation-cap
#            url: https://bmcbioinformatics.biomedcentral.com/articles/10.1186/s12859-021-04325-y
        description: | # this will include new lines to allow paragraphs
          The alpha-tubulin (α-tubulin) protein is a major structural component of microtubules which in turn are one of the three main filaments of the eukaryotic cytoskeleton. Microtubules are associated with important cellular functions, such as mitosis and meiosis, intracellular transport, cell motility, maintenance of the cell shape and others. The tubulin-tyrosine ligase (<i>TTL</i>) protein functions by ligating a tyrosine molecule at the detyrosinated C-terminal of α-tubulin. This process can have an effect on microtubule stability and subsequently on the cellular functions which are depended on the microtubule dynamics. In this work four experiments were performed which try to elucidate the consequences of engineered <i>TTL</i> genes in <i><a href="https://en.wikipedia.org/wiki/Drosophila_melanogaster">Drosophila melanogaster</a></i>. The experiments include:
            - Measuring viability and fertility of Drosophila flies
            - Confocal microscopy of Drosophila ovaries
            - Western blot of tyrosinated α-tubulin
            - TTL-GFP fusion gene cloning

          ![Confocal microscopy](/images/confocal.png "Confocal microscopy")
