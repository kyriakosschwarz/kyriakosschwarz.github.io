content:
  - title: Cheminformatics & Drug Discovery # Title for the section
    projects: true
    order: 100
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        border: weak
        title: "Database of Unified Chemical Knowledge (DUCK)"
        additional_links:
          - title: Paper
            icon: fas fa-graduation-cap
            url: https://chemrxiv.org/doi/full/10.26434/chemrxiv.15002055/v2
        description: |
          I built the <mark>Database of Unified Chemical Knowledge (DUCK)</mark> from 15 years of Roche ELN data, using failed reactions as negative data to improve yield prediction.
          
          ![DUCK Sunburst Plot](/images/duck_sunburst.png "Industrial reaction classes")
      - layout: left
        border: weak
        title: "AttentionDDI: Explainable drug–drug interaction prediction"
        additional_links:
          - title: Code
            icon: fab fa-github
            url: https://github.com/uzh-dqbm-cmi/side-effects/
          - title: Paper
            icon: fas fa-graduation-cap
            url: https://bmcbioinformatics.biomedcentral.com/articles/10.1186/s12859-021-04325-y
        description: |
          I developed <mark>AttentionDDI</mark>, an explainable <mark>Transformer</mark> model in <mark>PyTorch</mark> that predicts medication side effects.
          
          ![Transformer model](/images/ddi.png "Transformer model")
      - layout: left
        border: weak
        title: "Drug prescription clusters in the UK Biobank"
        additional_links:
          - title: Paper
            icon: fas fa-graduation-cap
            url: https://arxiv.org/abs/2207.08665
        description: |
          I clustered patients by prescription history and analyzed drug-drug interactions and five-year mortality in the <a href="https://www.ukbiobank.ac.uk/">UK Biobank</a>.
          
          ![UK Biobank patient](/images/ukbpatient.png "UK Biobank patient")
      - layout: left
        border: 
        title: "DDoS: Graph Neural Network for drug synergy prediction"
        additional_links:
          - title: Code
            icon: fab fa-github
            url: https://github.com/uzh-dqbm-cmi/graphnn
          - title: Paper
            icon: fas fa-graduation-cap
            url: https://arxiv.org/abs/2210.00802
        description: |
          I built <mark>DDoS</mark>, a <mark>PyTorch</mark> Graph Neural Network that predicts drug synergy in specific cell lines from molecular structures and gene expression.
          
          ![Graph Neural Network model](/images/gnn_molecule.png "Graph Neural Network model")
          
